<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Controller Test</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0; padding: 3vh 4vw;
    background: #10141c; color: #e8ecf2;
    font: 2.2vh/1.4 system-ui, "Segoe UI", sans-serif;
  }
  h1 { font-size: 4vh; margin: 0 0 1vh; }
  #summary { font-size: 2.6vh; margin-bottom: 2vh; color: #9fb4d0; }
  #summary b { color: #fff; }
  .warn { color: #ffb347; }
  #pads { display: grid; grid-template-columns: repeat(auto-fill, minmax(42vw, 1fr)); gap: 2vh 2vw; }
  .pad {
    border: 0.3vh solid #2c3648; border-radius: 1.2vh; padding: 1.5vh 1.5vw;
    background: #18202c; min-height: 20vh;
  }
  .pad.active { border-color: #4fd08a; }
  .pad.empty { opacity: 0.45; }
  .pad h2 { margin: 0; font-size: 2.8vh; }
  .pad .id { font-size: 1.7vh; color: #8a97ab; margin-bottom: 1vh; word-break: break-all; }
  .buttons { display: flex; flex-wrap: wrap; gap: 0.6vh; margin-bottom: 1vh; }
  .btn {
    width: 4.4vh; height: 4.4vh; border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    background: #263042; color: #8a97ab; font-size: 1.6vh;
  }
  .btn.on { background: #4fd08a; color: #06210f; font-weight: 700; }
  .axes { font-family: ui-monospace, Consolas, monospace; font-size: 1.9vh; color: #b9c6d8; }
  #log {
    margin-top: 2vh; padding: 1vh 1vw; background: #0b0e14; border-radius: 1vh;
    font-family: ui-monospace, Consolas, monospace; font-size: 1.7vh; color: #8a97ab;
    height: 14vh; overflow: hidden; white-space: pre-wrap;
  }
</style>
</head>
<body>
<h1>Controller Test</h1>
<div id="summary">Press any button on each controller to wake it up.</div>
<div id="pads"></div>
<div id="log"></div>

<script>
(function () {
  var BUTTON_NAMES = ['A','B','X','Y','LB','RB','LT','RT','View','Menu','LS','RS','Up','Dn','Lt','Rt','Home'];
  var summaryEl = document.getElementById('summary');
  var padsEl = document.getElementById('pads');
  var logEl = document.getElementById('log');
  var logLines = [];
  var maxSeen = 0;
  var cards = [];
  var lastPressed = {};

  function log(msg) {
    var t = new Date().toTimeString().slice(0, 8);
    logLines.push(t + '  ' + msg);
    if (logLines.length > 6) logLines.shift();
    logEl.textContent = logLines.join('\n');
  }

  function makeCard(i) {
    var card = document.createElement('div');
    card.className = 'pad empty';
    var h = document.createElement('h2');
    var id = document.createElement('div'); id.className = 'id';
    var buttons = document.createElement('div'); buttons.className = 'buttons';
    var axes = document.createElement('div'); axes.className = 'axes';
    card.appendChild(h); card.appendChild(id); card.appendChild(buttons); card.appendChild(axes);
    padsEl.appendChild(card);
    return { card: card, h: h, id: id, buttons: buttons, axes: axes, btnEls: [] };
  }

  function ensureCards(n) {
    while (cards.length < n) cards.push(makeCard(cards.length));
  }

  if (!('getGamepads' in navigator)) {
    summaryEl.innerHTML = '<span class="warn">This browser does not expose the Gamepad API' +
      (window.isSecureContext ? '.' : ' (page is not a secure context; try HTTPS).') + '</span>';
    return;
  }

  window.addEventListener('gamepadconnected', function (e) {
    log('connected: slot ' + e.gamepad.index + ' — ' + e.gamepad.id);
  });
  window.addEventListener('gamepaddisconnected', function (e) {
    log('disconnected: slot ' + e.gamepad.index);
  });
  // Shows whether controller presses are also arriving as keyboard/navigation events.
  window.addEventListener('keydown', function (e) {
    log('keydown: ' + e.key + ' (' + e.code + ')');
  });

  function frame() {
    var pads;
    try { pads = navigator.getGamepads(); }
    catch (err) {
      summaryEl.innerHTML = '<span class="warn">Gamepad API blocked: ' + err.message + '</span>';
      return;
    }
    var slots = pads.length;
    ensureCards(Math.max(slots, 4));
    var connected = 0;

    for (var i = 0; i < cards.length; i++) {
      var p = i < slots ? pads[i] : null;
      var c = cards[i];
      if (!p || !p.connected) {
        c.card.className = 'pad empty';
        c.h.textContent = 'Slot ' + i + ' — empty';
        c.id.textContent = '';
        c.buttons.textContent = '';
        c.btnEls = [];
        c.axes.textContent = '';
        continue;
      }
      connected++;
      c.h.textContent = 'Slot ' + i + ' — Player ' + (i + 1);
      c.id.textContent = p.id + '  [mapping: ' + (p.mapping || 'none') + ']';

      if (c.btnEls.length !== p.buttons.length) {
        c.buttons.textContent = '';
        c.btnEls = [];
        for (var b = 0; b < p.buttons.length; b++) {
          var el = document.createElement('div');
          el.className = 'btn';
          el.textContent = BUTTON_NAMES[b] || b;
          c.buttons.appendChild(el);
          c.btnEls.push(el);
        }
      }
      var anyOn = false;
      for (var k = 0; k < p.buttons.length; k++) {
        var on = p.buttons[k].pressed;
        c.btnEls[k].className = on ? 'btn on' : 'btn';
        var key = i + ':' + k;
        if (on && !lastPressed[key]) log('slot ' + i + ' pressed ' + (BUTTON_NAMES[k] || k));
        lastPressed[key] = on;
        if (on) anyOn = true;
      }
      var ax = [];
      for (var a = 0; a < p.axes.length; a++) {
        var v = p.axes[a];
        if (Math.abs(v) > 0.25) anyOn = true;
        ax.push((v >= 0 ? '+' : '') + v.toFixed(2));
      }
      c.axes.textContent = 'axes: ' + ax.join('  ');
      c.card.className = anyOn ? 'pad active' : 'pad';
    }

    if (connected > maxSeen) maxSeen = connected;
    summaryEl.innerHTML =
      'Connected now: <b>' + connected + '</b> · Most at once: <b>' + maxSeen +
      '</b> · Slots the browser offers: <b>' + slots + '</b> · Secure context: <b>' +
      (window.isSecureContext ? 'yes' : 'no') + '</b>';

    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
